# Lint and test launchd-run on macOS, where it runs (bash 3.2, BSD tools).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck
      - name: Shellcheck
        # SC2015 (info) is the notify() `a && b || c` chain that the audit's
        # P3 style pass turns into an if block; everything else must be clean.
        run: |
          shellcheck -e SC2015 launchd-run.sh
          shellcheck install.sh tests/run.sh
      - name: Tests (bash on PATH)
        run: bash tests/run.sh
      - name: Tests (/bin/bash 3.2, as launchd runs it)
        run: /bin/bash tests/run.sh
