# Lint and test launchd-run on macOS, where it runs (bash 3.2, BSD tools).
name: ci
# A PR runs once, on its pull_request event; push runs only on main (the
# merge), so a PR branch push and a release tag no longer run CI again on
# a commit that already passed (dev-toolchain#7).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to a PR cancels its older run, which would otherwise queue
# on the repo's one self-hosted runner; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: CI (the same script runs locally)
        run: bash tests/ci.sh
